name: Publicar Ludoteca

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # cada lunes de madrugada actualiza el catálogo de juegos
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v6
      # Guarda la última descarga buena de GameTDB por si un día no responde
      - uses: actions/cache@v4
        with:
          path: .cache/gametdb-*.xml
          key: gametdb-${{ github.run_id }}
          restore-keys: gametdb-
      - name: Preparar el catálogo de juegos
        run: python3 tools/build_index.py --out site/data --previous "${{ steps.pages.outputs.base_url }}/data"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
